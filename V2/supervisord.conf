[unix_http_server]
file=/run/1panel/supervisor.sock
chmod=0700                       ; sockef file mode (default 0700)

[supervisord]
nodaemon=true
user=root
logfile=/var/log/1panel-supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
pidfile=/run/1panel/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/1panel/supervisor.sock

[program:1panel-core]
command=/usr/local/bin/1panel-core
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:1panel-agent]
command=/usr/local/bin/1panel-agent
autostart=true
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
